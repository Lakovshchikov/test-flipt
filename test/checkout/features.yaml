version: "1.5"
namespace:
    key: checkout
    name: checkout
flags:
    - key: feature_enabled
      name: feature_enabled
      type: BOOLEAN_FLAG_TYPE
      enabled: false
      rollouts:
        - description: ivan is only one new user
          segment:
            keys:
                - only_new_users
            operator: OR_SEGMENT_OPERATOR
            value: true
    - key: f2
      name: f2
      type: BOOLEAN_FLAG_TYPE
      enabled: true
segments:
    - key: only_new_users
      name: only_new_users
      constraints:
        - type: STRING_COMPARISON_TYPE
          property: name
          operator: eq
          value: ivan
      match_type: ANY_MATCH_TYPE
    - key: test2
      name: test2
      match_type: ALL_MATCH_TYPE
